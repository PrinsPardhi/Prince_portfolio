  <rect x="378" y="34" width="184" height="358" rx="20" fill="url(#phonebg)"/>
  <!-- Status bar -->
  <rect x="378" y="34" width="184" height="28" rx="20" fill="#091510"/>
  <text x="396" y="52" font-family="Arial,sans-serif" font-size="8" fill="#64748B">9:41</text>
  <text x="534" y="52" font-family="Arial,sans-serif" font-size="8" fill="#64748B">●●●</text>
  <!-- Notch -->
  <rect x="445" y="36" width="70" height="14" rx="7" fill="#0d0d12"/>

