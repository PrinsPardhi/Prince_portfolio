  <!-- Left: Info side -->
  <!-- App name badge -->
  <rect x="40" y="40" width="160" height="32" rx="16" fill="url(#green1)" opacity="0.15"/>
  <rect x="40" y="40" width="160" height="32" rx="16" stroke="#10B981" stroke-width="1" fill="none" opacity="0.4"/>
  <circle cx="60" cy="56" r="6" fill="#10B981"/>
  <text x="73" y="60" font-family="Arial,sans-serif" font-size="11" fill="#10B981" font-weight="bold">Android App</text>

  <text x="40" y="112" font-family="Georgia,serif" font-size="28" font-weight="bold" fill="#F1F5F9">At Your Door</text>
  <text x="40" y="136" font-family="Georgia,serif" font-size="14" font-style="italic" fill="#10B981">On-Demand Grocery Delivery</text>

  <text x="40" y="168" font-family="Arial,sans-serif" font-size="10" fill="#64748B">Research Paper — IJRAR, 2020</text>
  <rect x="40" y="178" width="260" height="1" fill="#1e3a28"/>

  <text x="40" y="206" font-family="Arial,sans-serif" font-size="10" fill="#94A3B8">An Android-based platform connecting</text>
  <text x="40" y="222" font-family="Arial,sans-serif" font-size="10" fill="#94A3B8">local grocery stores with customers for</text>
  <text x="40" y="238" font-family="Arial,sans-serif" font-size="10" fill="#94A3B8">real-time ordering and doorstep delivery.</text>

  <!-- Tech pills -->
  <rect x="40" y="258" width="68" height="22" rx="11" fill="#1e3a28"/>
  <text x="62" y="273" font-family="Arial,sans-serif" font-size="9" fill="#10B981" text-anchor="middle">Android</text>

  <rect x="116" y="258" width="56" height="22" rx="11" fill="#1e3a28"/>
  <text x="144" y="273" font-family="Arial,sans-serif" font-size="9" fill="#10B981" text-anchor="middle">Java</text>

  <rect x="180" y="258" width="66" height="22" rx="11" fill="#1e3a28"/>
  <text x="213" y="273" font-family="Arial,sans-serif" font-size="9" fill="#F59E0B" text-anchor="middle">Firebase</text>

  <rect x="254" y="258" width="56" height="22" rx="11" fill="#1e3a28"/>
  <text x="282" y="273" font-family="Arial,sans-serif" font-size="9" fill="#0EA5E9" text-anchor="middle">Maps</text>

  <!-- Research paper box -->
  <rect x="40" y="296" width="290" height="80" rx="8" fill="url(#card4)" stroke="#1e3a28" stroke-width="1"/>
  <rect x="40" y="296" width="290" height="3" rx="2" fill="url(#green1)"/>
  <text x="56" y="316" font-family="Arial,sans-serif" font-size="10" font-weight="bold" fill="#F1F5F9">📄 Published Research</text>
  <text x="56" y="334" font-family="Arial,sans-serif" font-size="9" fill="#94A3B8">Title: "At Your Door" — Android-based</text>
  <text x="56" y="350" font-family="Arial,sans-serif" font-size="9" fill="#94A3B8">on-demand grocery delivery app.</text>
  <text x="56" y="366" font-family="Arial,sans-serif" font-size="9" fill="#10B981">IJRAR · Volume 7 · Issue 2 · 2020</text>

  <!-- Stats -->
  <rect x="40" y="392" width="80" height="20" rx="4" fill="#1e3a28"/>
  <text x="55" y="406" font-family="Arial,sans-serif" font-size="8" fill="#10B981">⭐ 4.7 Rating</text>
  <rect x="128" y="392" width="90" height="20" rx="4" fill="#1e3a28"/>
  <text x="140" y="406" font-family="Arial,sans-serif" font-size="8" fill="#94A3B8">1000+ Downloads</text>

  <!-- Phone mockup - right side -->
  <!-- Phone outer -->
  <rect x="370" y="18" width="200" height="390" rx="28" fill="#0d0d12" stroke="#2a2a3a" stroke-width="3"/>
