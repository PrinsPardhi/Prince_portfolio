  <!-- Category chips -->
  <rect x="386" y="140" width="46" height="18" rx="9" fill="#10B981" opacity="0.9"/>
  <text x="409" y="153" font-family="Arial,sans-serif" font-size="7" fill="#fff" text-anchor="middle">Fruits</text>
  <rect x="438" y="140" width="50" height="18" rx="9" fill="#1e3a28"/>
  <text x="463" y="153" font-family="Arial,sans-serif" font-size="7" fill="#64748B" text-anchor="middle">Veggies</text>
  <rect x="494" y="140" width="44" height="18" rx="9" fill="#1e3a28"/>
  <text x="516" y="153" font-family="Arial,sans-serif" font-size="7" fill="#64748B" text-anchor="middle">Dairy</text>

  <!-- Product cards -->
  <!-- Card A -->
  <rect x="386" y="166" width="80" height="92" rx="8" fill="#112218" stroke="#1e3a28" stroke-width="1"/>
  <rect x="395" y="172" width="62" height="44" rx="6" fill="#0a1f0f" style="display:flex;align-items:center;justify-content:center"/>
  <text x="426" y="200" font-family="Arial,sans-serif" font-size="20" text-anchor="middle">🍎</text>
  <text x="395" y="226" font-family="Arial,sans-serif" font-size="8" fill="#F1F5F9">Red Apples</text>
  <text x="395" y="238" font-family="Arial,sans-serif" font-size="8" fill="#10B981">₹80/kg</text>
  <rect x="440" y="247" width="18" height="8" rx="4" fill="#10B981"/>
  <text x="446" y="254" font-family="Arial,sans-serif" font-size="6" fill="#fff">+</text>

  <!-- Card B -->
  <rect x="474" y="166" width="78" height="92" rx="8" fill="#112218" stroke="#1e3a28" stroke-width="1"/>
  <rect x="483" y="172" width="60" height="44" rx="6" fill="#0a1f0f"/>
  <text x="513" y="200" font-family="Arial,sans-serif" font-size="20" text-anchor="middle">🥦</text>
  <text x="483" y="226" font-family="Arial,sans-serif" font-size="8" fill="#F1F5F9">Broccoli</text>
  <text x="483" y="238" font-family="Arial,sans-serif" font-size="8" fill="#10B981">₹60/pc</text>
  <rect x="528" y="247" width="18" height="8" rx="4" fill="#10B981"/>
  <text x="534" y="254" font-family="Arial,sans-serif" font-size="6" fill="#fff">+</text>

  <!-- Order tracking banner -->
  <rect x="386" y="266" width="166" height="50" rx="8" fill="#0a2810" stroke="#1a4020" stroke-width="1"/>
