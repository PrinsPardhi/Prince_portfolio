  <circle cx="400" cy="291" r="10" fill="#10B981" opacity="0.2"/>
  <text x="415" y="285" font-family="Arial,sans-serif" font-size="9" font-weight="bold" fill="#F1F5F9">Order En Route!</text>
  <text x="415" y="298" font-family="Arial,sans-serif" font-size="8" fill="#64748B">Arriving in ~12 min</text>
  <text x="415" y="309" font-family="Arial,sans-serif" font-size="7" fill="#10B981">Rahul (Delivery Partner)</text>

  <!-- Cart bottom bar -->
  <rect x="378" y="360" width="184" height="32" rx="0" fill="#0a2810" stroke="#1a4020" stroke-width="1"/>
  <rect x="384" y="363" width="90" height="26" rx="6" fill="#10B981"/>
  <text x="429" y="380" font-family="Arial,sans-serif" font-size="9" fill="#fff" font-weight="bold" text-anchor="middle">View Cart (3)</text>
  <text x="500" y="378" font-family="Arial,sans-serif" font-size="8" fill="#10B981">₹ 240</text>
  <text x="500" y="390" font-family="Arial,sans-serif" font-size="7" fill="#64748B">Total</text>

  <!-- Phone home bar -->
  <rect x="440" y="392" width="80" height="4" rx="2" fill="#2a2a3a"/>

  <!-- Second phone - shadowed -->
  <rect x="590" y="60" width="170" height="330" rx="24" fill="#0a0a0f" opacity="0.8" stroke="#1e1e2a" stroke-width="2"/>
  <rect x="597" y="74" width="156" height="304" rx="18" fill="#091510" opacity="0.8"/>
  <text x="675" y="200" font-family="Arial,sans-serif" font-size="32" text-anchor="middle" fill="#10B981" opacity="0.5">📦</text>
  <text x="675" y="230" font-family="Arial,sans-serif" font-size="11" fill="#F1F5F9" text-anchor="middle" opacity="0.7">Order Tracking</text>
  <text x="675" y="246" font-family="Arial,sans-serif" font-size="9" fill="#64748B" text-anchor="middle">Real-time Firebase</text>
  <!-- Progress steps -->
  <circle cx="625" cy="278" r="6" fill="#10B981"/>
  <line x1="631" y1="278" x2="659" y2="278" stroke="#10B981" stroke-width="1.5"/>
  <circle cx="665" cy="278" r="6" fill="#10B981"/>
  <line x1="671" y1="278" x2="700" y2="278" stroke="#1e3a28" stroke-width="1.5"/>
  <circle cx="706" cy="278" r="6" fill="#1e3a28"/>
  <text x="618" y="296" font-family="Arial,sans-serif" font-size="7" fill="#10B981">Packed</text>
  <text x="656" y="296" font-family="Arial,sans-serif" font-size="7" fill="#10B981">Picked</text>
  <text x="697" y="296" font-family="Arial,sans-serif" font-size="7" fill="#64748B">Arrive</text>
